schema_version = "1.0.0"
id = "blendcompact"
version = "1.0.0"
name = "BlendCompact"
tagline = "Save verified, compact copies of Blender projects"
maintainer = "QuickScene"
type = "add-on"
tags = ["System"]
website = "https://github.com/soooonice/blender-remote-extensions/tree/main/addons/BlendCompact"
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read the saved project and write a verified copy beside it"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
